<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Flow AI — Dashboard</title>
    <link rel="icon" type="image/png" href="assets/favicon.png"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary1: '#00E5FF',
                        primary2: '#B400FF',
                        darkbg: '#0A0F1F'
                    },
                    fontFamily: {
                        title: ['Montserrat', 'sans-serif'],
                        body: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-darkbg text-white font-body">

<!-- HEADER -->
<header class="w-full fixed top-0 bg-darkbg/80 backdrop-blur-lg border-b border-primary2/20 z-50">
    <div class="container mx-auto flex items-center justify-between py-4 px-6">
        <a href="index.html" class="flex items-center gap-3">
            <img src="assets/logo.png" class="h-10" alt="Flow AI Logo">
        </a>
        <nav class="hidden md:flex gap-6 font-body">
            <a href="technology.html" class="hover:text-primary1 transition">Technology</a>
            <a href="features.html" class="hover:text-primary1 transition">Features</a>
            <a href="about.html" class="hover:text-primary1 transition">About</a>
            <a href="dashboard.html" class="text-primary1">Dashboard</a>
        </nav>
    </div>
</header>

<!-- CONTENT -->
<section class="container mx-auto px-6 pt-28 pb-20">
    <h1 class="text-5xl font-title bg-gradient-to-r from-primary1 to-primary2 bg-clip-text text-transparent mb-10">
        Live IoT Dashboard
    </h1>

    <p class="text-gray-300 mb-10 max-w-2xl">
        Real-time values collected from the NETPIE IoT cloud.
        Data refreshes automatically every <span class="text-primary1 font-semibold">2 seconds</span>.
    </p>

    <!-- LIVE DATA TABLE -->
    <div class="border border-primary1/30 p-8 rounded-2xl bg-darkbg/40 mb-10">
        <h2 class="text-2xl font-title text-primary1 mb-4">Live Data</h2>

        <table class="w-full text-left">
            <thead>
            <tr class="text-primary1 border-b border-primary1/20">
                <th class="py-2">Key</th>
                <th class="py-2">Value</th>
            </tr>
            </thead>
            <tbody id="dataTable" class="text-gray-300"></tbody>
        </table>
    </div>

    <!-- RAW JSON VIEW -->
    <div class="border border-primary1/30 p-8 rounded-2xl bg-darkbg/40">
        <h2 class="text-2xl font-title text-primary2 mb-4">Raw JSON</h2>
        <pre id="jsonView" class="text-primary1 text-sm overflow-x-auto"></pre>
    </div>
</section>

<script>
    const NETPIE_URL = "TON_URL_JSON_NETPIE_ICI"; // <---- Mets ton lien ici

    async function loadNetpieData() {
        try {
            const res = await fetch(NETPIE_URL);
            const json = await res.json();

            // --- RAW JSON ---
            document.getElementById("jsonView").textContent =
                JSON.stringify(json, null, 2);

            // --- TABLE DATA ---
            const table = document.getElementById("dataTable");
            table.innerHTML = ""; // reset

            for (const key in json) {
                table.innerHTML += `
                    <tr class="border-b border-primary1/10">
                        <td class="py-2 text-primary1">${key}</td>
                        <td class="py-2">${json[key]}</td>
                    </tr>
                `;
            }

        } catch (err) {
            console.error(err);
            document.getElementById("jsonView").textContent = "Error fetching NETPIE data.";
        }
    }

    // Update every 2 seconds
    setInterval(loadNetpieData, 2000);
    loadNetpieData();
</script>

</body>
</html>
